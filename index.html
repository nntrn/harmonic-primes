<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <meta name="author" content="Annie Tran" />
  <title>harmonic primes by @nntrn</title>
  <!-- <link href="style.css" rel="stylesheet" /> -->
<style>
body,
html {
  text-size-adjust: none;
  -webkit-text-size-adjust: none;
  -moz-text-size-adjust: none;
  -ms-text-size-adjust: none
}
html{scrollbar-width:thin}
body{--counterw:26px;--counterh:26px;padding:0;margin:0 .25in;scrollbar-width:thin;font-family:monospace}
button,input{padding:.3rem;line-height:1;max-width:100px}
body{display:block;position:relative;scrollbar-width:thin;color:#333}
#primes{--cols:15;break-inside:avoid;display:inline-grid;grid-template-columns:repeat(var(--cols),1fr);justify-items:stretch;max-height:500px;overflow:scroll;scrollbar-width:none;overflow-x:scroll;max-width:100%}
.form{display:flex;flex-wrap:wrap;gap:0.25rem 0.5rem;margin:0;align-items:center}
[hidden]{display:none!important}
.flex{display:flex;gap:2rem;scrollbar-width:none}
#gb{white-space:pre;tab-size:8}
.box{display:flex;width:50vw;overflow-y:scroll;scrollbar-width:none;scrollbar-width:none}
pre{flex:1;word-break:break-word;white-space:pre-wrap;font-size:.9em;overflow-y:scroll;scrollbar-width:none;margin-top:0;overflow-x:hidden;background:#fff}
.box:last-child pre{scrollbar-width:none}
h3{font-family:monospace;font-weight:500}
.box{flex:1}
.row{display:flex;justify-content:space-between;align-content:center;align-items:center;margin:1rem 0;margin-bottom:2rem}
#primecode span{position:relative}
#primecode span[data-n]:hover{color:#00f}
#primecode span[data-n]:hover:after{content:"n=" attr(data-n);position:absolute;top:-1.5rem;white-space:pre;left:0;background:#222;color:#fff;border-radius:3px;font-size:.9em;padding:.1rem .35rem;display:flex;margin:auto}
@media (max-width:705px){
body{--counterw:20px;--counterh:20px}
.flex{flex-direction:column}
.box{width:100%}
}
@media (min-width:710px){
.primes{flex:2}
}
@media (max-width:710px) and (min-height:300px){
.groupby{flex:2}
.groupby *{columns:2;display:block;max-height:unset;column-gap:4rem;column-fill:balance}
} 
</style>
</head>
<body>
  <h1>harmonic prime generation</h1>
  <h3>created by annie tran <a href="https://github.com/nntrn/harmonic-primes">@nntrn</a></h3>
  <div class="row">
    <div class="form">
      <input id="minprime" type="number" min="1" step="10000" value="3" />
      <input id="maxprime" type="number" min="1" step="10000" value="1000" />
      <button onclick="genPrimes()">generate</button>
    </div>
    <div><button onclick="save()">primes.json</button></div>
  </div>
  <div class="flex">
    <div class="box groupby">
      <pre id="gb"></pre>
    </div>
    <div class="box primes">
      <pre id="primecode"></pre>
    </div>
  </div>
  <script src="script.js"></script>
</html>
